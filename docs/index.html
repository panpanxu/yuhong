<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>于洪 · 互动小说</title>
<style>:root {
  --ink: #d8d2c4;
  --dim: #8d8679;
  --bg: #100f0d;
  --panel: #171614;
  --line: #2a2723;
  --accent: #b08d57;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background:
    radial-gradient(1200px 600px at 50% -10%, #1d1b17 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 110%, #191512 0%, transparent 55%),
    var(--bg);
  color: var(--ink);
  font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", Georgia, serif;
  font-size: 16.5px;
  line-height: 1.95;
  letter-spacing: .02em;
}
.hidden { display: none !important; }

/* ---------- 菜单 ---------- */
#menu {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 24px;
  text-align: center;
}
.menutitle {
  font-size: 64px; letter-spacing: .34em; margin: 0 0 6px;
  color: #e8e0d0; font-weight: 400;
  text-shadow: 0 0 40px rgba(176,141,87,.22);
}
.menusub { color: var(--dim); letter-spacing: .28em; font-size: 13px; margin-bottom: 26px; }
.menuquote {
  max-width: 620px; color: #a29a8b; font-size: 15px; line-height: 2.1;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  padding: 18px 10px; margin-bottom: 34px;
}
.menuquote em { color: var(--accent); font-style: normal; }
.menubtns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.menubtns .choice { min-width: 210px; }
.menuload { margin-top: 18px; }

/* ---------- 模型设置 ---------- */
.cfgbox {
  margin-top: 26px; max-width: 620px; width: 100%;
  border: 1px solid var(--line); background: var(--panel);
  text-align: left;
}
.cfgbox summary {
  cursor: pointer; padding: 11px 16px; font-size: 12.5px;
  color: var(--dim); letter-spacing: .12em; user-select: none;
}
.cfgbox summary:hover { color: var(--ink); }
.cfgstate { color: var(--accent); margin-left: 6px; }
.cfgbody { padding: 4px 16px 16px; border-top: 1px solid var(--line); }
.cfgnote { font-size: 12px; color: var(--dim); line-height: 1.9; margin: 12px 0 14px; }
.cfgrow { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.cfglabel { width: 84px; flex: none; font-size: 12.5px; color: var(--dim); }
.cfginput {
  flex: 1; min-width: 0; background: #0e0d0b; border: 1px solid var(--line);
  color: var(--ink); font-family: inherit; font-size: 12.5px;
  padding: 7px 10px; border-radius: 2px; outline: none;
}
.cfginput:focus { border-color: var(--accent); }
.cfginput::placeholder { color: #4f4a42; }
.cfgbtns { display: flex; gap: 8px; margin-top: 12px; }
.cfgbtn {
  background: none; border: 1px solid var(--line); color: var(--dim);
  padding: 6px 14px; font-size: 12px; cursor: pointer; border-radius: 2px;
  font-family: inherit; letter-spacing: .1em;
}
.cfgbtn:hover { color: var(--ink); border-color: var(--accent); }
.cfgbtn.ghost:hover { border-color: #6b2f28; color: #c96a5f; }
.cfgmsg { margin-top: 10px; font-size: 12px; line-height: 1.7; color: var(--dim); min-height: 18px; }
.cfgmsg.ok { color: #7f9c6b; }
.cfgmsg.err { color: #c96a5f; }

/* ---------- 游戏 ---------- */
#game { min-height: 100%; display: flex; flex-direction: column; }
#topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 18px; border-bottom: 1px solid var(--line);
  background: rgba(16,15,13,.86); backdrop-filter: blur(6px);
  position: sticky; top: 0; z-index: 5;
}
#topbar .brand { font-size: 15px; letter-spacing: .22em; color: var(--accent); }
#topbar .spacer { flex: 1; }
#topbar button {
  background: none; border: 1px solid var(--line); color: var(--dim);
  padding: 5px 12px; font-size: 12.5px; cursor: pointer; border-radius: 2px;
  font-family: inherit; letter-spacing: .1em;
}
#topbar button:hover { color: var(--ink); border-color: #4a443c; }

#main { flex: 1; display: flex; max-width: 1080px; width: 100%; margin: 0 auto; padding: 26px 20px 120px; gap: 28px; }
#stage { flex: 1; min-width: 0; }
#side { width: 258px; flex: none; }
@media (max-width: 860px) {
  #main { flex-direction: column-reverse; padding-bottom: 60px; }
  #side { width: 100%; }
}

/* 状态卡 */
.who-card { border-left: 3px solid; padding-left: 12px; margin-bottom: 12px; background: var(--panel); padding: 12px 12px 12px 15px; }
.wname { font-size: 21px; letter-spacing: .14em; }
.wtitle { font-size: 12px; color: var(--dim); line-height: 1.7; margin-top: 3px; }
.stats { display: flex; flex-direction: column; gap: 9px; }
.stat { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.sl { width: 74px; flex: none; }
.bar { flex: 1; height: 5px; background: #221f1b; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; transition: width .5s ease; }
.sv { width: 26px; text-align: right; font-size: 11px; }

/* 文字流 */
#stream { max-width: 100%; }
.scene-title {
  margin: 34px 0 6px; padding-top: 15px; border-top: 1px solid var(--line);
  font-size: 13px; letter-spacing: .3em; color: var(--accent);
}
.scene-where { font-size: 12px; color: var(--dim); letter-spacing: .12em; margin-bottom: 16px; }
.line { margin: 0 0 12px; }
.line .body { white-space: pre-wrap; }
.line.said .body { color: #e6ddcb; }
.line.nar .body { color: #b9b2a4; }
.line.inner .body { color: #9d9487; font-style: italic; padding-left: 14px; border-left: 1px solid #332e28; }
.line.dream .body { color: #7d97a8; font-style: italic; }
.line.quote .body { color: #a89272; }
.line.bridge .body { color: var(--accent); letter-spacing: .08em; margin: 18px 0; }
.line.err .body { color: #b03a2e; }
.line.chosen .body { color: var(--dim); font-size: 13.5px; margin: 14px 0 6px; letter-spacing: .04em; }
.model-line { color: #8fa6a0; font-size: 14.5px; border-left: 2px solid #2f3a38; padding-left: 12px; margin: 16px 0 8px; line-height: 2; }
.model-line.pending { color: #4f5b59; font-style: italic; border-left-color: #232c2b; }
.quick { animation: fadein .18s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; } }

/* 说话人 */
.who { margin-right: 8px; font-size: 13px; letter-spacing: .1em; }
.who.liu { color: #c96a5f; }
.who.hao { color: #7a9fd0; }
.who.jie { color: #d1b072; }
.who.chen { color: #c08cb8; }
.who.mom { color: #a9a08f; }
.who.you { color: #a9a08f; }
.who:not(.liu):not(.hao):not(.jie):not(.chen):not(.mom):not(.you) { color: #8d8679; }

/* 选项 */
#choices { margin-top: 22px; display: flex; flex-direction: column; gap: 9px; }
.choice {
  text-align: left; background: var(--panel); border: 1px solid var(--line); color: var(--ink);
  padding: 12px 16px; font-family: inherit; font-size: 14.5px; line-height: 1.7;
  cursor: pointer; border-radius: 2px; transition: all .16s ease;
  display: flex; align-items: baseline; gap: 10px;
}
.choice:hover { border-color: var(--accent); background: #1c1a16; transform: translateX(3px); }
.choice .tag { font-size: 11px; color: var(--accent); letter-spacing: .16em; flex: none; }
.choice.continue { justify-content: center; color: var(--accent); border-style: dashed; }
.choice.continue:hover { background: #1c1a16; }

/* 结局 */
#ending { position: fixed; inset: 0; background: rgba(8,7,6,.94); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: auto; }
.end-card {
  max-width: 560px; width: 100%; border: 1px solid #3a352d; background: #131210;
  padding: 36px 30px; text-align: center; animation: fadein .5s ease;
}
.end-kicker { font-size: 11px; letter-spacing: .4em; color: var(--dim); }
.end-title { font-size: 38px; font-weight: 400; margin: 12px 0 8px; color: #e8e0d0; letter-spacing: .14em; }
.end-desc { color: var(--accent); font-size: 14px; margin-bottom: 20px; }
.end-you { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
.end-summary { text-align: left; font-size: 14px; color: #b9b2a4; line-height: 2; border-top: 1px solid var(--line); padding-top: 16px; }
.end-quote { margin-top: 18px; font-style: italic; color: #8d8679; font-size: 13.5px; }
.end-btns { margin-top: 26px; display: flex; justify-content: center; }
.end-btns .choice { min-width: 240px; justify-content: center; }

/* 滚动条 */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: #2a2723; border-radius: 4px; }
</style>
</head>
<body>

<div id="menu">
  <h1 class="menutitle">于洪</h1>
  <div class="menusub">班宇《于洪》· 互动小说 · 二〇〇四年的沈阳</div>
  <div class="menuquote">
    洪水是有温度的，内部暖热，这点没想到过。但也危险，如旋涡一般，拉着我们往下坠。<br>
    ——一九九八年，你是抗洪一代。一声令下，半句废话没有。<br>
    可回来之后，反而越活越越回旋了。<br>
    <em>这一次，你可以选一个人，替他把那几年重新走一遍。</em>
  </div>
  <div class="menubtns">
    <button class="choice" onclick="randomStart()"><span class="tag">随机</span><span>随机进入一个人的叙述</span></button>
    <button class="choice" onclick="startGame('liu')"><span class="tag">刘阳</span><span>从部队复员，在家等分配</span></button>
    <button class="choice" onclick="startGame('hao')"><span class="tag">郝鹏飞</span><span>在九路市场底下看自行车</span></button>
    <button class="choice" onclick="startGame('jie')"><span class="tag">郝洁</span><span>从大连回来，伺候妈</span></button>
    <button class="choice" onclick="startGame('chen')"><span class="tag">陈红</span><span>汽配城的经营点，还有一笔钱</span></button>
  </div>

  <details id="cfgbox" class="cfgbox">
    <summary>模型设置 <span class="cfgstate" id="cfgstate">未配置（离线模式）</span></summary>
    <div class="cfgbody">
      <p class="cfgnote">
        填写 OpenAI 兼容接口后，关键节点会由模型实时续写一小段。不填也能完整游玩，只是所有剧情按写好的走。
      </p>
      <label class="cfgrow">
        <span class="cfglabel">模型地址</span>
        <input id="cfgUrl" class="cfginput" type="text" placeholder="http://127.0.0.1:11434/v1/chat/completions" autocomplete="off" spellcheck="false">
      </label>
      <label class="cfgrow">
        <span class="cfglabel">模型 ID</span>
        <input id="cfgModel" class="cfginput" type="text" placeholder="比如 qwen2.5 / deepseek-chat" autocomplete="off" spellcheck="false">
      </label>
      <label class="cfgrow">
        <span class="cfglabel">API Key</span>
        <input id="cfgKey" class="cfginput" type="password" placeholder="没有就留空" autocomplete="off" spellcheck="false">
      </label>
      <div class="cfgbtns">
        <button type="button" class="cfgbtn" onclick="saveConfig()">保存</button>
        <button type="button" class="cfgbtn" onclick="testConfig()">测试连通</button>
        <button type="button" class="cfgbtn ghost" onclick="clearConfig()">清除</button>
      </div>
      <div class="cfgmsg" id="cfgmsg"></div>
    </div>
  </details>

  <div class="menuload">
    <button id="btnload" class="choice continue" onclick="tryLoad()">读取上次进度</button>
  </div>
</div>

<div id="game" class="hidden">
  <div id="topbar">
    <span class="brand">于洪</span>
    <span class="spacer"></span>
    <button onclick="if(saveGame())this.textContent='已保存';">保存进度</button>
    <button onclick="restartGame()">重开</button>
  </div>
  <div id="main">
    <div id="stage">
      <div id="stream"></div>
      <div id="choices"></div>
    </div>
    <div id="side">
      <div id="status"></div>
    </div>
  </div>
</div>

<div id="ending" class="hidden"></div>

<script>
/* ===== story.js ===== */
/* ============================================================
 *  《于洪》互动小说 —— 故事数据
 *  依据班宇《于洪》原文 + JioNLP「悬疑推理全解析」
 *  视角：刘阳(liu) / 郝鹏飞(hao) / 郝洁(jie) / 陈红(chen)
 * ============================================================ */
const L = (t) => ({ text: t });
const S = (who, whoKey, t) => ({ who, whoKey, cls: 'said', text: t });
const N = (t) => ({ text: t, cls: 'nar' });
const I = (t) => ({ text: t, cls: 'inner' });
const D = (t) => ({ text: t, cls: 'dream' });

const SCENES = {};

/* =====================================================================
 *  序章 · 1998 洪水 —— 四人共用
 * ===================================================================== */
SCENES.prologue = {
  title: '序章 · 一九九八年夏',
  where: '长江大堤 · 暴雨',
  lines: [
    L('一九九八年的夏天，江水高出防洪堤数米。天空被雨浸洗，星星全被覆盖。'),
    N('你们相互搀着走，由下至上，沿江而行。暴雨不停，很难看清前路。'),
    D('至水深处，黄泥漫过来，几近胸口，简直快要窒息。'),
    L('洪水是有温度的，内部暖热，如旋涡一般，拉着人往下坠。'),
    I('只能在心里提醒自己：千万别倒下去，那就再也站不起来了。'),
    N('刚开始时，前面还有人唱歌，喊着口号，很快便隐没在雷声里。四处缄默，唯有江中瀑布高耸。'),
    { text: '那年，你是抗洪一代，抢险子弟兵。一声令下，半句废话没有，一路辉煌，全是胜仗。', cls: 'quote' },
    { text: '可你没想到，回来之后，反而越活越回旋了。', cls: 'quote' },
    { text: '—— 现在，二〇〇四年，冬天，沈阳。', cls: 'bridge' },
    { text: '选一个人，进入他（她）的叙述。', cls: 'bridge' },
  ],
  choices: () => [
    { tag: '刘阳', text: '我从部队复员，在家等分配，大半年没个动静', next: 'liu_1999' },
    { tag: '郝鹏飞', text: '我在九路市场底下看自行车，叼着烟卷儿，腰里别个包儿', next: 'hao_1999' },
    { tag: '郝洁', text: '我从大连回来，在家伺候我妈，弟弟刚退伍', next: 'jie_1999' },
    { tag: '陈红', text: '我在汽配城有个经营点，卖摩托车油，也管着一笔钱', next: 'chen_1999' },
  ],
};

/* =====================================================================
 *  1999 冬 · 待业
 * ===================================================================== */
SCENES.liu_1999 = {
  where: '一九九九年冬 · 于洪区的街上',
  lines: [
    L('你去安置办问过几次。答复永远一样：就业形势不好，这一批没单位接收，只能耐心等待，要相信政府，祖国是没有忘记你们的。'),
    I('你听着也信服。可回到家里，思来想去，又实在是待不住。岁数不小了，还在街上晃荡，吃穿父母，没个班儿上，说不过去。'),
    N('战友们大多走了后门，在厂里开车，或当保安。没编制，待遇也不行，勉强维持生活。'),
    N('私下喝酒时，大家总爱抱怨：怎么说也是抗洪一代，一声令下豁得出命去，怎么回来之后反倒越活越回旋了。'),
    D('你半夜还是会梦见。站在桥上，江水涌动，瀑布高耸，时刻准备扑袭。'),
    N('将入冬时，你妈去九路市场买了几斤线，准备给你织件毛衣。她回来时，递你一张皱巴巴的纸条。'),
    S('妈', 'mom', '碰见个熟人，说是你战友，记忆力挺好，当年送站时见过我，一眼就认出来了，让你有空联系他。'),
    S('你', 'you', '叫啥。'),
    S('妈', 'mom', '郝鹏飞。'),
    S('你', 'you', '三眼儿啊，他干啥呢，问没。'),
    S('妈', 'mom', '在九路市场楼下看自行车呢，叼着烟卷儿，腰里别个包儿，见我可亲了，也没收费，站那唠了半天。还说你们这一批，马上就能安置了。'),
  ],
  choices: () => [
    { tag: '+ 记下', text: '把纸条收好。心里说：那人不识搭理。', next: 'liu_1999b', effects: { liuHaojie: 0 } },
    { tag: '+ 人情', text: '三眼儿还认得出我妈，这份人情得还。去找他喝一顿。', next: 'liu_1999b' },
    { tag: '＋钱', text: '你想起部队里一个领导，转业好几年了，听说挺有能力：李德武。要不要联系一下？', next: 'liu_call_li' },
  ],
};

SCENES.liu_1999b = {
  lines: [
    N('纸条上的电话七位数。你妈说，去年电话刚升八位：原来首位是2、3、4、5的，前面加个2；首位是6、7、8、9的，在前面加个8。'),
    I('这些你都知道。天天不上班，半导体里的报纸摘要能听好几遍。'),
    N('十二月初，你妈从单位下岗。车间工具库六个人，就留俩名额，上面要民主，不记名投票，谁的票多谁走人。'),
    N('结果一人一票，没办法抉择。开会时你妈自告奋勇：岁数大了，行动跟不上，先走一步；女的在世上比同岁的男的好找活儿，五十岁就能退休领劳保。'),
    N('话没说完，整个班组哭成一片。'),
    S('同事', 'other', '你儿子的工作落实没？'),
    S('妈', 'mom', '等政策呢，说是过了年就安置，能进事业单位。'),
    S('同事', 'other', '那可好，你这老有所依了。'),
    S('妈', 'mom', '那还说啥，你们放心，我这䞍等着享福呢。'),
    I('你知道这话是宽慰同事。但她这一下岗，工龄买断，给的都是死钱儿。你还没工作，生计犯愁。'),
    L('一九九九年的最后一天，下了点雪，不大。街上到处宣传千禧年的到来，仿佛跨过这个世纪，就真的会有所不同。'),
  ],
  choices: () => [
    { tag: '战友', text: '下午战友来电话：喊一批兵聚一聚，你想起三眼儿的号码。', next: 'liu_qianxi' },
    { tag: '独行', text: '不去凑热闹。你坐在家里看电视，把李德武那个电话号码又摸出来看了看。', next: 'liu_call_li' },
  ],
};

SCENES.liu_qianxi = {
  title: '千禧年 · 最后一天',
  where: '兴顺街 · 三眼儿的车棚',
  lines: [
    N('你给三眼儿打电话，七位数的号码，前面加了个2。一个女的接的。'),
    S('你', 'you', '三眼儿在家不？'),
    S('那边', 'other', '谁，你打错了吧。'),
    I('你才反应过来：这外号是部队里给取的，人家有本名儿。'),
    S('你', 'you', '这是不是郝鹏飞家，我是他以前的战友。'),
    S('那边', 'other', '是，他没在家，上班呢。换地方了，铁西商业大厦，那边车多。'),
    N('你骑车到兴顺街，远远望见三眼儿坐在绿棚里，棚顶上覆盖一层薄雪。他缩在里面，耷拉着脑袋，脖子上挂着手闷子，缓慢吐着白气。'),
    N('旁边有自行车过来，他立马探起身，三步两步奔上前，撕个纸票儿，管人要钱，块儿八毛的，毛票儿也数好几遍。'),
    N('你观察了一会儿，乐出声来。三眼儿回头一看，惊呼一声。'),
    S('三眼儿', 'hao', '我操，你咋来了呢。'),

/* ---------------- 模型接入（OpenAI 兼容）---------------- */
const LLM = { url: '', model: '', key: '', enabled: false };

function setLLMConfig(cfg) {
  cfg = cfg || {};
  LLM.url = (cfg.url || '').trim();
  LLM.model = (cfg.model || '').trim();
  LLM.key = (cfg.key || '').trim();
  LLM.enabled = !!(LLM.url && LLM.model);
}

function llmReady() { return LLM.enabled; }

async function llmChat(messages, opts) {
  opts = opts || {};
  if (!LLM.enabled) throw new Error('没有配置模型');
  const headers = { 'Content-Type': 'application/json' };
  if (LLM.key) headers['Authorization'] = 'Bearer ' + LLM.key;
  const body = {
    model: LLM.model,
    messages: messages,
    temperature: opts.temperature == null ? 0.9 : opts.temperature,
  };
  if (opts.maxTokens) body.max_tokens = opts.maxTokens;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), opts.timeout || 60000);
  let res;
  try {
    res = await fetch(LLM.url, { method: 'POST', headers: headers, body: JSON.stringify(body), signal: ctrl.signal });
  } finally {
    clearTimeout(timer);
  }
  if (!res.ok) {
    const t = await res.text().catch(() => '');
    throw new Error('HTTP ' + res.status + ' ' + t.slice(0, 160));
  }
  const data = await res.json();
  const msg = data && data.choices && data.choices[0] && data.choices[0].message;
  const text = msg ? (typeof msg.content === 'string' ? msg.content : JSON.stringify(msg.content)) : '';
  if (!text) throw new Error('返回内容为空');
  return text.trim();
}

async function llmTest(cfg) {
  const saved = { url: LLM.url, model: LLM.model, key: LLM.key, enabled: LLM.enabled };
  LLM.url = cfg.url; LLM.model = cfg.model; LLM.key = cfg.key || ''; LLM.enabled = true;
  try {
    const reply = await llmChat(
      [{ role: 'user', content: '只回复两个字：正常' }],
      { temperature: 0, maxTokens: 16, timeout: 20000 }
    );
    return LLM.model + ' 已响应「' + reply.slice(0, 20) + '」';
  } finally {
    LLM.url = saved.url; LLM.model = saved.model; LLM.key = saved.key; LLM.enabled = saved.enabled;
  }
}

/* 让模型给当前节点续写一小段（离线时返回 null，由剧本原文接上） */
async function llmNarrate(sceneId, sceneTitle, recentLines, charName) {
  if (!LLM.enabled) return null;
  const sys = [
    '你在续写一篇以沈阳为背景的中文短篇小说，风格参考班宇：',
    '句子短，口语化，多用具体物件，不写心理总结，不解释人物动机，不出现现代词汇。',
    '只输出正文，不要标题，不要任何说明，80 到 140 字。'
  ].join('');
  const user = [
    '当前章节：' + (sceneTitle || ''),
    '正在叙述的人：' + (charName || ''),
    '刚刚发生的几句：',
    (recentLines || []).slice(-6).map(l => l.text || l).join('\n'),
    '请接一段，保持同样的口吻，往前推一点点。'
  ].join('\n');
  try {
    return await llmChat([{ role: 'system', content: sys }, { role: 'user', content: user }], { maxTokens: 400 });
  } catch (e) {
    return null; // 失败就静默回落到离线剧情
  }
}

}
function snapshot() {
  return JSON.stringify({ scene: G.scene, flags: G.flags, seen: G.seen, char: G.char, log: G.log.slice(-300) });
}
function restore(str) {
  const s = JSON.parse(str);

}
function setFlag(k, v) {

  else G.flags[k] = v;
}
function clampFlags() {
  const lo = ['liuHaojie','liuChenHong','haoHaojie','chenLiu','chenTruth','money','policeHeat','liuSuspected','haoWanted','haoRage','jieLiu','jieWater'];
  lo.forEach(k => {

}

/* ---------------- 打字器 ---------------- */
const SPEED = 13;
function clearTimers() {
  if (G.typeTimer) { clearTimeout(G.typeTimer); G.typeTimer = null; }
  G.typing = false;
}

function line(opts) {
  const el = document.createElement('div');
  el.className = 'line ' + (opts.cls || '');
  if (opts.who) {
    const w = document.createElement('span');
    w.className = 'who ' + (opts.whoKey || '');
    w.textContent = opts.who;
    el.appendChild(w);
  }
  const body = document.createElement('span');
  body.className = 'body';
  body.dataset.full = opts.text || '';
  el.appendChild(body);
  const box = document.getElementById('stream');
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  return { el, body };
}

function typeText(body, text, done) {
  clearTimers();
  G.typing = true;
  let i = 0;
  body.textContent = '';
  const step = () => {
    if (i >= text.length) { G.typing = false; G.typeTimer = null; done && done(); return; }
    const n = Math.max(1, Math.round(Math.random() * 2));
    body.textContent += text.slice(i, i + n);
    i += n;
    const box = document.getElementById('stream');
    box.scrollTop = box.scrollHeight;
    G.typeTimer = setTimeout(step, SPEED + Math.random() * SPEED);
  };
  step();
}

function playLines(lines, done) {
  G.curLines = lines; G.curIdx = 0; G.inScene = true;
  const next = () => {
    if (G.curIdx >= lines.length) { G.inScene = false; done && done(); return; }
    const o = lines[G.curIdx++];
    if (!o) { next(); return; }
    const { body } = line(o);
    if (o.instant) { body.textContent = o.text || ''; next(); return; }
    typeText(body, o.text || '', next);
  };
  next();
}

/* 点击跳过：第一次点补全当前行并继续播剩下的；再点推进 */
document.addEventListener('click', () => {
  if (G.typing) {
    clearTimers();
    const all = document.querySelectorAll('#stream .line .body');
    const last = all[all.length - 1];
    if (last) last.textContent = last.dataset.full || '';
    // 继续播剩余行
    const lines = G.curLines, start = G.curIdx;
    const rest = lines.slice(start);
    playLinesRest(rest);
    return;
  }
}, true);

function playLinesRest(rest) {
  let idx = 0;
  G.typing = false;
  const next = () => {
    if (idx >= rest.length) {
      G.inScene = false;
      if (G._afterLines) { const f = G._afterLines; G._afterLines = null; f(); }
      return;
    }
    const o = rest[idx++];
    if (!o) { next(); return; }
    const { body } = line(o);
    body.textContent = o.text || '';
    body.parentNode.classList.add('quick');
    next();
  };
  next();
}

/* ---------------- 渲染工具 ---------------- */
function renderChoices(list) {
  const box = document.getElementById('choices');
  box.innerHTML = '';
  if (!list || !list.length) return;
  list.forEach((c) => {
    const btn = document.createElement('button');
    btn.className = 'choice';
    if (c.tag) {
      const t = document.createElement('span');
      t.className = 'tag';
      t.textContent = c.tag;
      btn.appendChild(t);
    }
    const txt = document.createElement('span');
    txt.textContent = c.text;
    btn.appendChild(txt);
    btn.onclick = () => {
      box.innerHTML = '';
      const { body } = line({ cls: 'chosen', text: '' });
      body.textContent = '▶ ' + c.text;
      if (c.effects) Object.keys(c.effects).forEach(k => setFlag(k, c.effects[k]));
      clampFlags();
      G.history.push({ scene: G.scene, choice: c.text, snap: snapshot() });
      G.seen[G.scene] = (G.seen[G.scene] || 0) + 1;
      renderStatus();
      goto(c.next);
    };
    box.appendChild(btn);
  });
}

function renderContinue(text, next) {
  const box = document.getElementById('choices');
  box.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'choice continue';
  btn.textContent = text || '继续';
  btn.onclick = () => { box.innerHTML = ''; goto(next); };
  box.appendChild(btn);
}

/* ---------------- 场景跳转 ---------------- */
function resolve(id) {
  if (!id) return { lines: [{ text: '（故事到此为止。）' }] };
  if (typeof id === 'function') return { fn: id };
  const s = SCENES[id];
  if (!s) return { lines: [{ text: '（缺失场景：' + id + '）', cls: 'err' }] };
  // 结局路由是以函数形式存放的场景，直接交给 goto 执行
  if (typeof s === 'function') return { fn: s };
  const visit = G.seen[id] || 0;
  if (s.variants && s.variants.length) {
    const v = s.variants[Math.min(visit, s.variants.length - 1)];
    return resolve(v);
  }
  return s;
}

function goto(id) {
  if (typeof id === 'string') G.scene = id;
  const sc = resolve(id);
  if (sc.fn) { sc.fn(); return; }
  if (sc.title) {
    const t = document.createElement('div');
    t.className = 'scene-title';
    t.textContent = sc.title;
    document.getElementById('stream').appendChild(t);
  }
  if (sc.where) {
    const t = document.createElement('div');
    t.className = 'scene-where';
    t.textContent = sc.where;
    document.getElementById('stream').appendChild(t);
  }
  const box = document.getElementById('stream');
  box.scrollTop = box.scrollHeight;

  G._afterLines = () => {
    // 配了模型就让它先续一小段，然后再出选项 / 继续按钮
    if (LLM.enabled && sc.lines && sc.lines.length) {
      appendModelLine(sc);
    } else {
      afterScene(sc);
    }
  };
  playLines(sc.lines || [], G._afterLines);
}

function afterScene(sc) {
  if (sc.choices) {
    renderChoices(typeof sc.choices === 'function' ? sc.choices() : sc.choices);
  } else if (sc.next) {
    renderContinue(sc.continueText || '继续', sc.next);
  } else if (sc.end) {
    const btn = document.createElement('button');
    btn.className = 'choice continue';
    btn.textContent = sc.continueText || '……';
    btn.onclick = () => {
      if (typeof sc.end === 'function') sc.end();
      else location.reload();
    };
    document.getElementById('choices').appendChild(btn);
  }
}

/* 在场景末尾追加一段由模型写的文字；失败就跳过，不影响剧情推进 */
function appendModelLine(sc) {
  const stream = document.getElementById('stream');
  const hint = document.createElement('div');
  hint.className = 'model-line pending';
  hint.textContent = '（正在续写……）';
  stream.appendChild(hint);
  stream.scrollTop = stream.scrollHeight;

  const charName = G.char && CHARS[G.char] ? CHARS[G.char].name : '';
  llmNarrate(G.scene, sc.title, sc.lines, charName).then(text => {
    if (!text) {
      hint.remove();
      afterScene(sc);
      return;
    }
    hint.remove();
    const el = document.createElement('div');
    el.className = 'line model-line';
    el.textContent = text;
    stream.appendChild(el);
    stream.scrollTop = stream.scrollHeight;
    afterScene(sc);
  });
}

/* ---------------- 存档 ---------------- */
const SAVE_KEY = 'yuhong_save_v2';
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, snapshot()); return true; }
  catch (e) { return false; }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    restore(raw);
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    document.getElementById('ending').classList.add('hidden');
    renderStatus();
    document.getElementById('stream').innerHTML = '';
    goto(G.scene);
    return true;
  } catch (e) { return false; }
}

/* ---------------- 状态面板 ---------------- */
function renderStatus() {
  const box = document.getElementById('status');
  if (!G.char) { box.innerHTML = ''; return; }
  const c = CHARS[G.char];
  const f = G.flags;
  const bar = (label, v, color) => {
    const p = Math.max(0, Math.min(100, v || 0));
    return `<div class="stat"><span class="sl">${label}</span><span class="bar"><i style="width:${p}%;background:${color}"></i></span><span class="sv">${p}</span></div>`;
  };
  const rows = [];
  if (G.char === 'liu') {
    rows.push(bar('与郝洁', f.liuHaojie, '#c08b3e'));
    rows.push(bar('与陈红', f.liuChenHong, '#8e4a8a'));
    rows.push(bar('手里的钱', f.money, '#4d7a4d'));
    rows.push(bar('警方的注意', f.policeHeat, '#b03a2e'));
  } else if (G.char === 'hao') {
    rows.push(bar('对姐姐', f.haoHaojie, '#c08b3e'));
    rows.push(bar('通缉的火候', f.haoWanted, '#b03a2e'));
    rows.push(bar('心里的恨', f.haoRage, '#6b1f18'));
  } else if (G.char === 'jie') {
    rows.push(bar('对刘阳', f.jieLiu, '#8b1d18'));
    rows.push(bar('对弟弟', f.haoHaojie, '#1d3f6e'));
    rows.push(bar('心里压着的水', f.jieWater, '#3a5f7a'));
  } else if (G.char === 'chen') {
    rows.push(bar('对刘阳', f.chenLiu, '#8b1d18'));
    rows.push(bar('账上的钱', f.money, '#4d7a4d'));
    rows.push(bar('警方的注意', f.policeHeat, '#b03a2e'));
  }
  box.innerHTML = `<div class="who-card" style="border-left-color:${c.color}">
      <div class="wname" style="color:${c.color}">${c.name}</div>
      <div class="wtitle">${c.title}</div></div><div class="stats">${rows.join('')}</div>`;
}

/* ---------------- 随机开场 ---------------- */
function randomChar() {
  const keys = ['liu', 'hao', 'jie', 'chen'];
  return keys[Math.floor(Math.random() * keys.length)];
}

function startGame(charKey) {
  if (!CHARS[charKey]) charKey = randomChar();
  resetState();
  G.char = charKey;
  if (charKey === 'jie') { G.flags.jieLiu = 20; G.flags.jieWater = 55; G.flags.haoHaojie = 65; }
  if (charKey === 'chen') { G.flags.chenLiu = 10; G.flags.money = 40; G.flags.chenTruth = 5; }
  if (charKey === 'hao') { G.flags.haoHaojie = 65; G.flags.haoRage = 40; G.flags.haoWanted = 10; }
  if (charKey === 'liu') { G.flags.liuHaojie = 0; G.flags.money = 0; G.flags.policeHeat = 10; }
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('ending').classList.add('hidden');
  renderStatus();
  document.getElementById('stream').innerHTML = '';
  goto({ liu: 'liu_1999', hao: 'hao_1999', jie: 'jie_1999', chen: 'chen_1999' }[charKey]);
}

/* ---------------- 结局卡片 ---------------- */
const ENDINGS = [
  { n: '结局一', t: '直起腰来', d: '走出瀑布，进入海中。' },
  { n: '结局二', t: '水中的两个人', d: '两个人都不肯先放手。' },
  { n: '结局三', t: '各自的命数', d: '活着的日子还得接着过下去。' },
  { n: '结局四', t: '帆影', d: '远处楼群正如帆影，扬起一角，缓缓移动。' },
  { n: '结局五', t: '千禧年的雪', d: '一九九九年的最后一天，雪不大。' },
];

function showEnding(info) {
  info = info || {};
  const box = document.getElementById('ending');
  const c = CHARS[G.char];
  const e = ENDINGS[Math.max(0, Math.min(4, (info.num || 1) - 1))];
  box.innerHTML = `<div class="end-card">
      <div class="end-kicker">${e.n}</div>
      <h2 class="end-title">${e.t}</h2>
      <div class="end-desc">${e.d}</div>
      <div class="end-you">你扮演的是 <b style="color:${c.color}">${c.name}</b></div>
      ${info.summary ? `<div class="end-summary">${info.summary}</div>` : ''}
      ${info.quote ? `<div class="end-quote">${info.quote}</div>` : ''}
      <div class="end-btns">
        <button class="choice continue" onclick="backToMenu()">重开一次（换一个人）</button>
      </div>
    </div>`;
  box.classList.remove('hidden');
  document.getElementById('choices').innerHTML = '';
  try { localStorage.removeItem(SAVE_KEY); } catch (err) {}
}
</script>
<script>
function randomStart() {
  startGame(randomChar());
}
function tryLoad() {
  if (!loadGame()) alert('没有找到上次的进度。');
}
function restartGame() {
  if (!confirm('回到开头，重新选一个人？')) return;
  try { location.reload(); } catch (e) { backToMenu(); }
  setTimeout(function () {
    var game = document.getElementById('game');
    if (game && !game.classList.contains('hidden')) backToMenu();
  }, 120);
}

/* ---------------- 模型设置 ---------------- */
const CFG_KEY = 'yuhong_llm_cfg';

function readConfig() {
  let cfg = { url: '', model: '', key: '' };
  try {
    const raw = localStorage.getItem(CFG_KEY);
    if (raw) cfg = Object.assign(cfg, JSON.parse(raw));
  } catch (e) {}
  return cfg;
}

function refreshConfigUI() {
  const cfg = readConfig();
  const u = document.getElementById('cfgUrl');
  const m = document.getElementById('cfgModel');
  const k = document.getElementById('cfgKey');
  const s = document.getElementById('cfgstate');
  if (u) u.value = cfg.url || '';
  if (m) m.value = cfg.model || '';
  if (k) k.value = cfg.key || '';
  if (s) s.textContent = (cfg.url && cfg.model) ? '已配置：' + cfg.model : '未配置（离线模式）';
  if (typeof setLLMConfig === 'function') setLLMConfig(cfg);
}

function saveConfig() {
  const cfg = {
    url: (document.getElementById('cfgUrl').value || '').trim(),
    model: (document.getElementById('cfgModel').value || '').trim(),
    key: (document.getElementById('cfgKey').value || '').trim(),
  };
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
  if (typeof setLLMConfig === 'function') setLLMConfig(cfg);
  refreshConfigUI();
  const msg = document.getElementById('cfgmsg');
  if (msg) {
    msg.className = 'cfgmsg ok';
    msg.textContent = (cfg.url && cfg.model) ? '已保存，关键节点会调用模型。' : '已保存（离线模式）。';
  }
}

function clearConfig() {
  try { localStorage.removeItem(CFG_KEY); } catch (e) {}
  if (typeof setLLMConfig === 'function') setLLMConfig({ url: '', model: '', key: '' });
  refreshConfigUI();
  const msg = document.getElementById('cfgmsg');
  if (msg) { msg.className = 'cfgmsg'; msg.textContent = '已清除，回到离线模式。'; }
}

function testConfig() {
  const msg = document.getElementById('cfgmsg');
  const url = (document.getElementById('cfgUrl').value || '').trim();
  const model = (document.getElementById('cfgModel').value || '').trim();
  const key = (document.getElementById('cfgKey').value || '').trim();
  if (!url || !model) {
    if (msg) { msg.className = 'cfgmsg err'; msg.textContent = '地址和模型 ID 都得填。'; }
    return;
  }
  if (msg) { msg.className = 'cfgmsg'; msg.textContent = '正在测试……'; }
  if (typeof llmTest === 'function') {
    llmTest({ url, model, key }).then(function (info) {
      if (msg) { msg.className = 'cfgmsg ok'; msg.textContent = '连通正常：' + info; }
    }).catch(function (err) {
      if (msg) { msg.className = 'cfgmsg err'; msg.textContent = '连接失败：' + (err && err.message ? err.message : err); }
    });
  } else {
    if (msg) { msg.className = 'cfgmsg err'; msg.textContent = '引擎未加载模型模块。'; }
  }
}

function backToMenu() {
  var menu = document.getElementById('menu');
  var game = document.getElementById('game');
  var ending = document.getElementById('ending');
  var stream = document.getElementById('stream');
  var choices = document.getElementById('choices');
  if (game) game.classList.add('hidden');
  if (ending) ending.classList.add('hidden');
  if (menu) menu.classList.remove('hidden');
  if (stream) stream.innerHTML = '';
  if (choices) choices.innerHTML = '';
  if (typeof resetState === 'function') resetState();
  if (typeof G !== 'undefined' && G) { G.char = null; G.scene = null; }
  refreshConfigUI();
}

document.addEventListener('DOMContentLoaded', refreshConfigUI);
</script>
